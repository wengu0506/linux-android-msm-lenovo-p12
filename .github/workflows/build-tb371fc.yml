name: Build TB371FC Kernel (Android)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检出当前分支代码 (自动识别当前分支)
      uses: actions/checkout@v4

    - name: 2. 配置底层编译环境 (Python2 + 核心依赖)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc kmod cpio flex libncurses5-dev libelf-dev libssl-dev dwarves bison ccache curl wget git python2 python2-dev
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 3. 拉取纯正的 AOSP 交叉编译工具链
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
        git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64

    - name: 4. 正式开始多线程全速编译
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/clang-r353983c/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm64/bin:$PATH"
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC="ccache clang"
        export LD=aarch64-linux-android-ld.bfd

        echo "=> 第一步：生成 Android 专属配置文件..."
        make -j$(nproc) V=1 CROSS_COMPILE=$CROSS_COMPILE CLANG_TRIPLE=$CLANG_TRIPLE ARCH=$ARCH CC="$CC" vendor/tb371fc_defconfig

        echo "=> 第二步：开始编译..."
        make -j$(nproc) V=1 CROSS_COMPILE=$CROSS_COMPILE CLANG_TRIPLE=$CLANG_TRIPLE ARCH=$ARCH CC="$CC" LD=$LD

    - name: 5. 自动打包并上传战利品
      uses: actions/upload-artifact@v4
      with:
        name: TB371FC-Android-Kernel
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/dts/qcom/*.dtb
        compression-level: 9
